  - id: task-009
    title: Выровнять заголовки карточек в блоке «Направления работы»
    description: В блоке «Направление нашей работы» заголовок первой карточки
      «Помощь в трудных случаях» находится не на одном уровне с заголовками
      других карточек. Нужно поправить вёрстку так, чтобы все заголовки карточек
      начинались на одной высоте.
    status: completed
