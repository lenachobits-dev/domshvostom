  - id: task-015
    title:
      Добавить блок «Пространство комплексной помощи» (scroll-storytelling с
      лапой)
    description: >-
      Добавить на сайт после блока «Грантовая поддержка» scroll-driven
      storytelling блок с визуальным центром — стилизованной собачьей лапой.


      Заголовок: «Пространство комплексной помощи»

      Подзаголовок: «От лечения до ухода — всё, что помогает животному
      восстановиться»


      Структура: центральная часть (пятка) — общая идея блока. 4 пальца — 4
      этапа помощи:

      1. Диагностика и контроль состояния (весы, тонометр, пульсоксиметр,
      микроскоп, диагностическое освещение)

      2. Лечение и поддержка (инфузионный насос, кислородный концентратор,
      камера оксигенации, медицинский штатив)

      3. Процедуры и клиническая работа (ветеринарный стол и светильник,
      носилки, ультразвуковой скалер, резиновый коврик)

      4. Уход и реабилитация (груминг-стол, ванна, фен-компрессор, машинка,
      ножницы, стул грумера, матрац с подогревом)


      Механика: sticky-блок фиксируется на экране. При скролле поэтапно
      раскрывается каждый палец — активный палец увеличивается, рядом появляется
      текст. После 4 шагов блок отпускает скролл. Индикатор прогресса. На
      мобильных — облегчённая версия.
    status: completed
