      - Заголовки всех карточек в блоке «Направления работы» выровнены по одной
        линии
      - Сайт открывается без ошибок
      - Typecheck, lint, build проходят
    summary: "Исправлено выравнивание заголовков карточек в блоке «Направления
      работы». Проблема была в том, что .dir-card__body использовал transform:
      translateY(5.5rem), из-за чего видимая часть тела зависела от высоты
      контента — первая карточка с длинным заголовком и описанием имела больше
      видимой области, и заголовок оказывался выше. Решение: убран translateY с
      тела карточки (тело всегда внизу), описание скрывается через max-height: 0
      + opacity: 0 и раскрывается на hover. Правки в app/globals.css в
      селекторах .dir-card__body и .dir-card__desc. typecheck, lint (0 errors),
      build проходят без ошибок."
