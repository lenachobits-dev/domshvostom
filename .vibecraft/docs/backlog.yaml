      scroll-driven sticky-механику, как на десктопе:


      1. Пальчики на лапке должны переключаться по мере скролла вниз.

      2. Блок должен быть sticky (фиксирован на экране) до тех пор, пока все 4
      этапа не будут пройдены при скролле, и только потом отпускать скролл к
      следующему блоку.

      3. При каждом этапе показывается текст с заголовком этапа и списком
      оборудования (как на десктопе).

